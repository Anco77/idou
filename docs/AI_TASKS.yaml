schema_version: 1
project: idou
updated_at: "2026-08-13"
source_commit: "958a3f5"
current_release: "1.3.7"
target_release: "1.4.0"
max_in_progress: 1
status_values: [planned, ready, in_progress, blocked, done, cancelled]
default_gates: [format, analyze, full_tests, diff_review, docs_update]

phases:
  - id: S0
    title: 工程基线
    exit: Flutter 工具链稳定，当前工作区改动归属明确，自动测试可复现且可信
  - id: S1
    title: 领域与数据底座
    exit: 领域模型、用例边界、schema v3 和受控媒体通过测试
  - id: S2
    title: 豆仓可靠性
    exit: 单色与批量库存原子一致，阈值和流水正确
  - id: S3
    title: 图纸识别
    exit: 样本驱动识别达到质量门槛并有安全门禁
  - id: S4
    title: 编辑与图纸闭环
    exit: 可编辑、保存、扣库、补扣、重启恢复
  - id: S5
    title: 图片转图纸
    exit: 转换进入共享编辑和保存闭环
  - id: S6
    title: 导出与发布
    exit: 导出备份、双平台和发布门禁全部完成

